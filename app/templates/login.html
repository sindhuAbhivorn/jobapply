<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
</head>
<body>
  <div class="login-box">
    <h2>Login with Email</h2>
    {% if messages %}
      {% for msg in messages %}
        <p style="color:green;">{{ msg }}</p>
      {% endfor %}
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Enter your email" required><br>
      <button type="submit">Send OTP</button>
    </form>
  </div>
</body>
</html>
