<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/job_application.css' %}">
</head>
<body>
  <div class="container">
    <h2>Job Application Form</h2>

    {% if messages %}
    <div class="messages">
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div>
        <label>Full Name</label>
        <input type="text" name="full_name" required>
      </div>

      <div>
        <label>Gender</label>
        <select name="gender" required>
          <option value="">Select</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div>
        <label>Date of Birth</label>
        <input type="date" name="dob" required>
      </div>

      <div>
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div>
        <label>Phone</label>
        <input type="text" name="phone" required>
      </div>

      <div class="full">
        <label>Address</label>
        <textarea name="address" rows="3" required></textarea>
      </div>

      <div>
        <label>Education</label>
        <input type="text" name="education" required>
      </div>

      <div>
        <label>Graduation Year</label>
        <input type="number" name="graduation_year" required>
      </div>

      <div class="full">
        <label>Skills</label>
        <input type="text" name="skills" placeholder="e.g., Python, Django, HTML, CSS" required>
      </div>

      <div>
        <label>Experience (in years)</label>
        <input type="number" step="0.1" name="experience" required>
      </div>

      <div>
        <label>Resume (PDF/DOC)</label>
        <input type="file" name="resume" accept=".pdf,.doc,.docx" required>
      </div>

      <div>
        <label>Job Role</label>
        <input type="text" name="job_role" required>
      </div>

      <div>
        <label>Current Company</label>
        <input type="text" name="current_company">
      </div>

      <div>
        <label>Expected Salary</label>
        <input type="number" name="expected_salary">
      </div>

      <div>
        <label>Notice Period (in days)</label>
        <input type="number" name="notice_period">
      </div>

      <div>
        <label>Willing to Relocate?</label>
        <select name="relocate" required>
          <option value="">Select</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>

      <div>
        <label>Referral Code</label>
        <input type="text" name="referral_code" maxlength="10" required>
      </div>

      <button type="submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
